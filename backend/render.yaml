services:
  - type: web
    name: studyroom-api
    env: python
    buildCommand: "pip install uv && uv sync && uv run alembic upgrade head"
    startCommand: "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
