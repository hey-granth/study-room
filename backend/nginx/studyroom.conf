# Redirect HTTP → HTTPS and handle Let's Encrypt ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Let's Encrypt ACME challenge (must be reachable over HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server with WebSocket proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.yourdomain.com;

    # SSL certificates — managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for JSON/text payloads
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1024;

    # WebSocket upgrade map — must be in server or http block
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- Health check (no rate limiting, no auth, no access log) ---
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Main API + WebSocket proxy ---
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Real client IP forwarding (required for uvicorn --proxy-headers)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for WebSocket long-lived connections.
        # Default 60s would kill every WebSocket after 1 min idle.
        # The app-level heartbeat handles truly dead connections.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        # REQUIRED for WebSocket and SSE.
        # With buffering on, Nginx waits for a complete response before
        # forwarding — WebSocket connections never complete, so they hang.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
