version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: studyroom_db_dev
    environment:
      POSTGRES_DB: studyroom_dev
      POSTGRES_USER: studyroom
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: studyroom_redis_dev
    command: redis-server --requirepass devpassword
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: studyroom_api_dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://studyroom:devpassword@db:5432/studyroom_dev
      REDIS_URL: redis://:devpassword@redis:6379/0
      DEBUG: "true"
      APP_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app          # Hot reload
      - ./alembic:/app/alembic
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_dev_data:
  redis_dev_data:
