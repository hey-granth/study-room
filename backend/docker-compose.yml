version: "3.9"

# Production docker-compose for StudyRoom API.
# PostgreSQL is hosted on Neon (external managed service).
# Redis is hosted on Upstash (external managed service).
# This file only runs the FastAPI application container.

services:
  api:
    image: ${ECR_IMAGE}
    container_name: studyroom_api
    restart: unless-stopped
    env_file: .env
    ports:
      # CRITICAL: bind to 127.0.0.1 only — Nginx proxies to this.
      # Never expose 0.0.0.0:8000 or the API is directly internet-accessible.
      - "127.0.0.1:8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
